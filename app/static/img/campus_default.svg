<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Sky & Atmosphere Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="35%" stop-color="#060e22"/>
      <stop offset="70%" stop-color="#0a183d"/>
      <stop offset="100%" stop-color="#0e2354"/>
    </linearGradient>
    
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldPillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="25%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="wallNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111c38"/>
      <stop offset="50%" stop-color="#0b1429"/>
      <stop offset="100%" stop-color="#060c1a"/>
    </linearGradient>

    <linearGradient id="wallNavyLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18274d"/>
      <stop offset="100%" stop-color="#0e1833"/>
    </linearGradient>

    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#0a1530"/>
    </linearGradient>

    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.85"/>
    </linearGradient>

    <radialGradient id="centralAura" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#060d1f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1428"/>
      <stop offset="40%" stop-color="#060c18"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>

  <!-- Starry Constellations & Particles -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="280" cy="140" r="1.2"/>
    <circle cx="450" cy="70" r="1.8"/>
    <circle cx="620" cy="110" r="1"/>
    <circle cx="780" cy="60" r="2" fill="#fef08a"/>
    <circle cx="950" cy="90" r="1.4"/>
    <circle cx="1120" cy="50" r="1.6"/>
    <circle cx="1300" cy="130" r="1.2"/>
    <circle cx="1480" cy="85" r="2" fill="#fef08a"/>
    <circle cx="220" cy="220" r="1"/>
    <circle cx="1380" cy="210" r="1.3"/>
  </g>

  <!-- Central Ambient Light Aura -->
  <ellipse cx="800" cy="380" rx="600" ry="320" fill="url(#centralAura)"/>

  <!-- Distant Campus Wings / Silhouette -->
  <path d="M 50 560 L 320 560 L 320 440 L 420 440 L 420 560 L 1180 560 L 1180 440 L 1280 440 L 1280 560 L 1550 560 L 1550 680 L 50 680 Z" fill="#091224" opacity="0.8"/>

  <!-- Secondary Wings (Left & Right Colonnades) -->
  <!-- Left Wing -->
  <rect x="180" y="470" width="340" height="190" fill="url(#wallNavy)" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1"/>
  <!-- Left Wing Windows (Row 1 & 2) -->
  <g fill="url(#windowGlow)" opacity="0.85">
    <rect x="210" y="495" width="28" height="42" rx="14 14 0 0"/>
    <rect x="255" y="495" width="28" height="42" rx="14 14 0 0"/>
    <rect x="300" y="495" width="28" height="42" rx="14 14 0 0"/>
    <rect x="345" y="495" width="28" height="42" rx="14 14 0 0"/>
    <rect x="390" y="495" width="28" height="42" rx="14 14 0 0"/>
    <rect x="435" y="495" width="28" height="42" rx="14 14 0 0"/>

    <rect x="210" y="565" width="28" height="42" rx="14 14 0 0"/>
    <rect x="255" y="565" width="28" height="42" rx="14 14 0 0"/>
    <rect x="300" y="565" width="28" height="42" rx="14 14 0 0"/>
    <rect x="345" y="565" width="28" height="42" rx="14 14 0 0"/>
    <rect x="390" y="565" width="28" height="42" rx="14 14 0 0"/>
    <rect x="435" y="565" width="28" height="42" rx="14 14 0 0"/>
  </g>

  <!-- Right Wing -->
  <rect x="1080" y="470" width="340" height="190" fill="url(#wallNavy)" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1"/>
  <!-- Right Wing Windows -->
  <g fill="url(#windowGlow)" opacity="0.85">
    <rect x="1110" y="495" width="28" height="42" rx="14 14 0 0"/>
    <rect x="1155" y="495" width="28" height="42" rx="14 14 0 0"/>
    <rect x="1200" y="495" width="28" height="42" rx="14 14 0 0"/>
    <rect x="1245" y="495" width="28" height="42" rx="14 14 0 0"/>
    <rect x="1290" y="495" width="28" height="42" rx="14 14 0 0"/>
    <rect x="1335" y="495" width="28" height="42" rx="14 14 0 0"/>

    <rect x="1110" y="565" width="28" height="42" rx="14 14 0 0"/>
    <rect x="1155" y="565" width="28" height="42" rx="14 14 0 0"/>
    <rect x="1200" y="565" width="28" height="42" rx="14 14 0 0"/>
    <rect x="1245" y="565" width="28" height="42" rx="14 14 0 0"/>
    <rect x="1290" y="565" width="28" height="42" rx="14 14 0 0"/>
    <rect x="1335" y="565" width="28" height="42" rx="14 14 0 0"/>
  </g>

  <!-- Wing Cornices with Gold Trims -->
  <rect x="160" y="460" width="380" height="12" fill="#0d1b3e" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="1060" y="460" width="380" height="12" fill="#0d1b3e" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- MAIN CENTRAL ROTUNDA & FACADE -->
  <!-- Grand Dome Structure -->
  <path d="M 680 320 C 680 180, 920 180, 920 320 Z" fill="url(#domeGrad)" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="800" cy="180" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <polygon points="800,140 803,170 797,170" fill="#f59e0b"/>

  <!-- Dome Drum with Arched Apertures -->
  <rect x="670" y="320" width="260" height="60" fill="url(#wallNavyLight)" stroke="#f59e0b" stroke-width="1.5"/>
  <g fill="url(#windowGlow)" opacity="0.9">
    <rect x="695" y="335" width="16" height="30" rx="8 8 0 0"/>
    <rect x="735" y="335" width="16" height="30" rx="8 8 0 0"/>
    <rect x="775" y="335" width="16" height="30" rx="8 8 0 0"/>
    <rect x="815" y="335" width="16" height="30" rx="8 8 0 0"/>
    <rect x="855" y="335" width="16" height="30" rx="8 8 0 0"/>
    <rect x="895" y="335" width="16" height="30" rx="8 8 0 0"/>
  </g>

  <!-- Central Building Block -->
  <rect x="520" y="380" width="560" height="280" fill="url(#wallNavy)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Triangular Pediment (Tympanum) -->
  <polygon points="500,430 800,320 1100,430" fill="url(#wallNavyLight)" stroke="#f59e0b" stroke-width="3"/>
  
  <!-- Pediment Golden Inscription / Relief Circle -->
  <circle cx="800" cy="385" r="28" fill="#060e22" stroke="#f59e0b" stroke-width="2.5"/>
  <!-- University Shield Emblem inside Circle -->
  <path d="M 790 375 L 810 375 L 810 390 C 810 398, 800 404, 800 404 C 800 404, 790 398, 790 390 Z" fill="#f59e0b"/>
  <polygon points="800,368 805,378 795,378" fill="#fbbf24"/>

  <!-- Entablature Beam -->
  <rect x="490" y="430" width="620" height="24" fill="#0d1b3e" stroke="#f59e0b" stroke-width="2"/>
  <text x="800" y="446" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" letter-spacing="4" text-anchor="middle">ACADEMIAPRO • VIRTUS ET SCIENTIA</text>

  <!-- Grand Corinthian / Ionic Golden Pillars (6 Classical Columns) -->
  <g>
    <!-- Column 1 -->
    <rect x="530" y="454" width="22" height="206" fill="url(#goldPillar)"/>
    <rect x="524" y="454" width="34" height="10" fill="#f59e0b" rx="2"/>
    <rect x="522" y="652" width="38" height="10" fill="#d97706" rx="2"/>

    <!-- Column 2 -->
    <rect x="620" y="454" width="22" height="206" fill="url(#goldPillar)"/>
    <rect x="614" y="454" width="34" height="10" fill="#f59e0b" rx="2"/>
    <rect x="612" y="652" width="38" height="10" fill="#d97706" rx="2"/>

    <!-- Column 3 -->
    <rect x="710" y="454" width="22" height="206" fill="url(#goldPillar)"/>
    <rect x="704" y="454" width="34" height="10" fill="#f59e0b" rx="2"/>
    <rect x="702" y="652" width="38" height="10" fill="#d97706" rx="2"/>

    <!-- Column 4 -->
    <rect x="868" y="454" width="22" height="206" fill="url(#goldPillar)"/>
    <rect x="862" y="454" width="34" height="10" fill="#f59e0b" rx="2"/>
    <rect x="860" y="652" width="38" height="10" fill="#d97706" rx="2"/>

    <!-- Column 5 -->
    <rect x="958" y="454" width="22" height="206" fill="url(#goldPillar)"/>
    <rect x="952" y="454" width="34" height="10" fill="#f59e0b" rx="2"/>
    <rect x="950" y="652" width="38" height="10" fill="#d97706" rx="2"/>

    <!-- Column 6 -->
    <rect x="1048" y="454" width="22" height="206" fill="url(#goldPillar)"/>
    <rect x="1042" y="454" width="34" height="10" fill="#f59e0b" rx="2"/>
    <rect x="1040" y="652" width="38" height="10" fill="#d97706" rx="2"/>
  </g>

  <!-- Grand Entrance Portal (Double Oak Doors with Golden Arched Transom) -->
  <g>
    <!-- Recessed Entrance Wall -->
    <rect x="752" y="500" width="96" height="160" fill="#040914" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M 752 540 C 752 485, 848 485, 848 540 L 848 660 L 752 660 Z" fill="url(#windowGlow)" opacity="0.95"/>
    <!-- Iron filigree grid -->
    <path d="M 752 540 L 848 540 M 800 495 L 800 660" stroke="#060d1f" stroke-width="2"/>
    <!-- Grand Doors -->
    <rect x="760" y="555" width="38" height="105" fill="#0d1b3e" stroke="#f59e0b" stroke-width="1"/>
    <rect x="802" y="555" width="38" height="105" fill="#0d1b3e" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="792" cy="610" r="2.5" fill="#fbbf24"/>
    <circle cx="808" cy="610" r="2.5" fill="#fbbf24"/>
  </g>

  <!-- Grand Ceremonial Steps (Staircase Cascade) -->
  <g fill="#0b1736" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1">
    <rect x="460" y="660" width="680" height="12"/>
    <rect x="430" y="672" width="740" height="14"/>
    <rect x="400" y="686" width="800" height="16"/>
    <rect x="370" y="702" width="860" height="18"/>
    <rect x="340" y="720" width="920" height="20"/>
  </g>

  <!-- Foreground Plaza Esplanade & Ambient Pathway Lights -->
  <rect x="0" y="740" width="1600" height="160" fill="url(#groundGrad)"/>
  
  <!-- Campus Lawn & Path Lines in Perspective -->
  <polygon points="800,740 680,900 920,900" fill="#071024" opacity="0.6"/>
  <line x1="800" y1="740" x2="680" y2="900" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="800" y1="740" x2="920" y2="900" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Lanterns / Classical Street Lamps -->
  <g>
    <!-- Left Lamp -->
    <line x1="380" y1="670" x2="380" y2="760" stroke="#f59e0b" stroke-width="3"/>
    <polygon points="372,670 388,670 384,652 376,652" fill="#fbbf24"/>
    <circle cx="380" cy="660" r="14" fill="#fbbf24" opacity="0.3"/>
    
    <!-- Right Lamp -->
    <line x1="1220" y1="670" x2="1220" y2="760" stroke="#f59e0b" stroke-width="3"/>
    <polygon points="1212,670 1228,670 1224,652 1216,652" fill="#fbbf24"/>
    <circle cx="1220" cy="660" r="14" fill="#fbbf24" opacity="0.3"/>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="1600" height="900" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="6"/>
</svg>