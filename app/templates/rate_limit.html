<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>429 - Rate Limit Exceeded | AcademiaPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at 50% 20%, #171d36 0%, #060e22 70%, #030712 100%);
            min-height: 100vh;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .limit-card {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 158, 11, 0.35);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            border-radius: 24px;
            max-width: 520px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
        }
        .limit-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(245, 158, 11, 0.15);
            border: 2px solid rgba(245, 158, 11, 0.4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: #f59e0b;
            margin-bottom: 20px;
        }
        .countdown {
            font-family: 'JetBrains Mono', monospace;
            font-size: 32px;
            font-weight: 700;
            color: #fbbf24;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="limit-card">
        <div class="limit-icon">
            <i class="fa-solid fa-gauge-high"></i>
        </div>
        <h3 class="fw-bold mb-2">Too Many Requests</h3>
        <p class="text-white-50 small mb-3">Rate Limiting Active â€¢ AcademiaPro Throttling Protection</p>

        <p class="text-white-50 small">
            Your connection has sent more requests than allowed per minute. Please take a brief moment before trying again.
        </p>

        <div class="countdown" id="timerBox">
            <span id="secondsLeft">{{ retry_after }}</span>s
        </div>

        <button onclick="window.location.reload()" class="btn btn-warning fw-bold px-4 py-2 rounded-3 mt-2">
            <i class="fa-solid fa-rotate me-1"></i> Refresh Page
        </button>
    </div>

    <script>
        let timeLeft = parseInt(document.getElementById('secondsLeft').innerText) || 60;
        const countdownEl = document.getElementById('secondsLeft');
        const interval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(interval);
                window.location.reload();
            } else {
                countdownEl.innerText = timeLeft;
            }
        }, 1000);
    </script>
</body>
</html>
